

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat App</title>

    <link rel="stylesheet" href="./chat.css">

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>

<body>

    <!-- Logout button -->
    <button class="logout-button" onclick="logout()">
        Logout
    </button>


    <div class="chat-container">

        <!-- Header -->

        <div class="chat-header">

            <div class="profile">

                <div class="profile-image">
                    K
                </div>

                <div class="profile-info">
                    <h3>Group Chat</h3>
                    <span id="connection-status">
                        Connecting...
                    </span>
                </div>

            </div>

        </div>


        <!-- Room Search -->

        <div class="room-search">

            <form id="searchForm" class="search-form">

                <input
                    type="email"
                    id="emailInput"
                    name="search"
                    placeholder="Enter user's email"
                    autocomplete="off"
                    required
                >

                <button type="submit" id="joinRoomButton">
                    Join
                </button>

            </form>

            <div class="room-status">
                <span id="room-status-text">
                    Enter an email to join a chat
                </span>
            </div>

        </div>


        <!-- Private Chat Section -->
<section id="privateChatSection" style="display: none;">
    <h2 id="privateChatTitle">Private Chat</h2>

    <div id="privateMessages"></div>

    <form id="privateMessageForm">
        <input
            type="text"
            id="privateMessageInput"
            placeholder="Type a private message..."
            required
        />
        <button type="submit">Send</button>
    </form>
</section>


        <!-- Messages -->

        <div class="messages" id="messages">

        </div>


        <!-- Message Input -->

        <form class="message-form" id="messageForm">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button type="submit">
                ➤
            </button>

        </form>

    </div>


    <script src="./chat1.js"></script>

</body>

</html>
