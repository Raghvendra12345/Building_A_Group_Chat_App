<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat UI</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="chat-container">

        <!-- Chat Header -->
        <header class="chat-header">

            <div class="profile">
                <div class="profile-image">K</div>

                <div class="profile-info">
                    <h3>Koko</h3>
                    <span>Online</span>
                </div>
            </div>

            <div class="header-actions">
                <button>⋮</button>
            </div>

        </header>


        <!-- Chat Messages -->
        <main class="messages" id="messages">

            <div class="message received">
                <div class="message-content">
                    <p>Hello! How are you?</p>
                    <span class="timestamp">10:30 AM</span>
                </div>
            </div>


            <div class="message sent">
                <div class="message-content">
                    <p>I'm good! How are you?</p>
                    <span class="timestamp">10:31 AM</span>
                </div>
            </div>


            <div class="message received">
                <div class="message-content">
                    <p>I'm doing great 😊</p>
                    <span class="timestamp">10:32 AM</span>
                </div>
            </div>


            <div class="message sent">
                <div class="message-content">
                    <p>That's great to hear!</p>
                    <span class="timestamp">10:33 AM</span>
                </div>
            </div>


            <div class="message received">
                <div class="message-content">
                    <p>Are you working on the chat application?</p>
                    <span class="timestamp">10:34 AM</span>
                </div>
            </div>


            <div class="message sent">
                <div class="message-content">
                    <p>Yes, I'm building the chat window now.</p>
                    <span class="timestamp">10:35 AM</span>
                </div>
            </div>

        </main>


        <!-- Message Input -->
        <form class="message-form" id="messageForm">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button type="submit" id="sendButton">
                ➤
            </button>

        </form>

    </div>

    <script src="http://localhost:4700/socket.io/socket.io.js"></script>
    <script src="./chat.js"></script>
</body>
</html>
